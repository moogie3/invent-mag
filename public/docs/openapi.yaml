  /api/payment/confirm:
    post:
      summary: 'Confirm payment directly from frontend after successful Snap transaction.'
      operationId: confirmPaymentDirectlyFromFrontendAfterSuccessfulSnapTransaction
      description: "This ensures the plan is updated immediately without waiting for webhook.\n\nSecurity: Verifies the order belongs to the current tenant."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: string
                  description: ''
                  example: consequatur
                transaction_result:
                  type: object
                  description: ''
                  example: []
                  properties: {  }
              required:
                - order_id
                - transaction_result
  /api/login:
    post:
      summary: ''
      operationId: postApiLogin
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid login details'
                properties:
                  message:
                    type: string
                    example: 'Invalid login details'
      tags:
        - Endpoints
  /api/register:
    post:
      summary: 'Handle an incoming registration request.'
      operationId: handleAnIncomingRegistrationRequest
      description: ''
      parameters: []
      responses:
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The password field confirmation does not match.'
                  errors:
                    password:
                      - 'The password field confirmation does not match.'
                properties:
                  message:
                    type: string
                    example: 'The password field confirmation does not match.'
                  errors:
                    type: object
                    properties:
                      password:
                        type: array
                        example:
                          - 'The password field confirmation does not match.'
                        items:
                          type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: vmqeopfuudtdsufvyvddq
                shopname:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: amniihfqcoynlazghdtqt
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: andreanne00@example.org
                password:
                  type: string
                  description: ''
                  example: 'O[2UZ5ij-e/dl4m{o,'
                plan:
                  type: string
                  description: ''
                  example: professional
                  enum:
                    - starter
                    - professional
                    - enterprise
                  nullable: true
              required:
                - name
                - shopname
                - email
                - password
  /api/lookup-tenant:
    post:
      summary: "Find a tenant's domain by their shop name."
      operationId: findATenantsDomainByTheirShopName
      description: ''
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Shop not found.'
                properties:
                  message:
                    type: string
                    example: 'Shop not found.'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shopname:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: vmqeopfuudtdsufvyvddq
              required:
                - shopname
