openapi: 3.0.3
info:
  title: 'INVENT-MAG API Documentation'
  description: 'Invent-MAG exposes a deliberately small REST API covering authentication, CMS content, and supporting endpoints. All other functionality is served by the session-authenticated web admin panel (`/admin/*`) and is intentionally not part of the API.'
  version: 1.0.0
servers:
  -
    url: 'http://127.0.0.1.nip.io'
tags:
  -
    name: Authentication
    description: 'Public registration, login, and tenant lookup, plus token refresh for authenticated clients.'
  -
    name: 'CMS Content'
    description: 'Public landing-page content served to the Astro marketing site at build time.'
  -
    name: Contact
    description: 'Marketing-site contact form submission.'
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/login:
    post:
      summary: 'Log in and receive an API token.'
      operationId: logInAndReceiveAnAPIToken
      description: "Authenticates the user with email and password and returns a Sanctum\nbearer token for authenticated API calls. Rate-limited to 5 requests\nper minute per IP."
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  token: 1|abcdefghijklmnopqrstuvwxyz
                  token_type: Bearer
                properties:
                  token:
                    type: string
                    example: 1|abcdefghijklmnopqrstuvwxyz
                  token_type:
                    type: string
                    example: Bearer
        401:
          description: 'invalid credentials'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid login details'
                properties:
                  message:
                    type: string
                    example: 'Invalid login details'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "The user's email address."
                  example: qkunze@example.com
                password:
                  type: string
                  description: "The user's password."
                  example: 'O[2UZ5ij-e/dl4m{o,'
              required:
                - email
                - password
      security: []
  /api/v1/refresh-token:
    post:
      summary: 'Refresh the current API token.'
      operationId: refreshTheCurrentAPIToken
      description: "Revokes the current token and issues a new one with a one-day expiry.\nCall this with the token you want to replace."
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  token: 2|abcdefghijklmnopqrstuvwxyz
                  expires_at: '2026-08-13T09:00:00.000000Z'
                properties:
                  token:
                    type: string
                    example: 2|abcdefghijklmnopqrstuvwxyz
                  expires_at:
                    type: string
                    example: '2026-08-13T09:00:00.000000Z'
      tags:
        - Authentication
  /api/cms:
    get:
      summary: 'Get marketing-site CMS content.'
      operationId: getMarketingSiteCMSContent
      description: "Returns the landing-page copy (hero, features, pricing, CTA, footer)\nserved to the Astro marketing site at build time. Responses are cached\nfor 1 hour."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  hero_title: 'The All-In-One ERP to Streamline Your Business'
                  hero_subtitle: 'From inventory and sales to a full accounting suite, Invent-MAG provides the tools you need to make smarter, data-driven decisions and accelerate your growth.'
                  hero_cta_text: 'Start 30-Day Free Trial'
                  hero_cta_url: /signup
                  hero_cta_demo_text: 'Try Live Demo'
                  hero_cta_demo_url: 'https://demo-pro.invent-mag.web.id/admin/login'
                  features_title: 'Everything You Need'
                  features_subtitle: 'A Better Way to Manage Your Business'
                  features_description: "Invent-MAG isn't just another tool, it's a complete ecosystem designed to give you a bird's-eye view of your entire operation, from inventory to accounting."
                  features_enterprise_heading: 'Enterprise Features'
