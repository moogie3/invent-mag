name: Laravel CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  # deploy.yml calls this same workflow, so a release tag can never reach
  # production without this exact suite having passed first.
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        # phpunit.xml runs the suite on :memory: sqlite, so pdo_sqlite/sqlite3
        # are load-bearing. pcntl backs PHPUnit's enforceTimeLimit.
        extensions: bcmath, ctype, fileinfo, json, mbstring, openssl, pcntl, pdo, pdo_sqlite, sqlite3, tokenizer, xml
        coverage: none # Set to 'xdebug' if you want code coverage reports

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer Dependencies
      uses: ramsey/composer-install@v3
      with:
        dependency-versions: "locked"
        composer-options: "--ignore-platform-reqs"
        # Omitting --no-dev so that testing tools are included
        
    - name: Generate Application Key
      run: php artisan key:generate

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install NPM Dependencies
      run: npm install

    - name: Build Frontend Assets
      run: npm run build

    - name: Run Tests
      run: php artisan test

    - name: Run JS Tests
      run: npx vitest run
      # vitest boots a Vite dev server to run the tests, and
      # laravel-vite-plugin's ensureCommandShouldRunInEnvironment throws for
      # any non-build command when env.CI is defined (GitHub Actions always
      # sets CI=true) - "You should not run the Vite HMR server in CI
      # environments". The plugin reads the flag via loadEnv(..., "") at
      # config time, so process.env of this step is in scope; this is the
      # exact escape hatch the error message names.
      env:
        LARAVEL_BYPASS_ENV_CHECK: '1'

    - name: Prepare Artifact
      run: |
        mkdir -p build-artifact
        rsync -av --progress . build-artifact/ \
          --exclude ".git" \
          --exclude ".github" \
          --exclude "node_modules" \
          --exclude ".env" \
          --exclude ".env.example" \
          --exclude "storage/framework/cache/data" \
          --exclude "storage/framework/sessions" \
          --exclude "storage/framework/views" \
          --exclude "storage/logs"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact
        path: build-artifact/
