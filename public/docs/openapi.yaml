  /api/contact:
    post:
      summary: 'Handle the marketing-site contact form submission.'
      operationId: handleTheMarketingSiteContactFormSubmission
      description: "Validates the form, passes the built-in honeypot (`botcheck` must stay\nempty), and emails the platform contact address."
      parameters: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Message sent successfully!'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Message sent successfully!'
        422:
          description: 'validation error'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Validation failed'
                  errors:
                    email:
                      - 'The email field must be a valid email address.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Validation failed'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email field must be a valid email address.'
                        items:
                          type: string
        500:
          description: 'mail failure'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Failed to send message. Please try again.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Failed to send message. Please try again.'
      tags:
        - Contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "The sender's full name."
                  example: consequatur
                email:
                  type: string
                  description: "The sender's email address."
                  example: qkunze@example.com
                company:
                  type: string
                  description: "optional The sender's company name."
                  example: consequatur
                  nullable: true
                topic:
                  type: string
                  description: 'The selected topic.'
                  example: support
                  enum:
                    - sales
                    - support
                    - demo
                    - partnership
                    - other
                message:
                  type: string
                  description: 'The message body.'
                  example: consequatur
                botcheck:
                  type: string
                  description: 'optional Honeypot field — leave empty to pass spam protection.'
                  example: consequatur
              required:
                - name
                - email
                - topic
                - message
      security: []
