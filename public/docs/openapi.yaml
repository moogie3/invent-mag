paths:
  /api/contact:
    post:
      summary: 'Handle the marketing-site contact form submission.'
      operationId: handleTheMarketingSiteContactFormSubmission
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Message sent successfully!'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Message sent successfully!'
      tags:
        - Contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: "The sender's full name."
                  example: consequatur
                email:
                  type: string
                  description: "The sender's email address."
                  example: qkunze@example.com
                company:
                  type: string
                  description: "optional The sender's company name."
                  example: consequatur
                  nullable: true
                topic:
                  type: string
                  description: 'The selected topic.'
                  example: support
                  enum:
                    - sales
                    - support
                    - demo
                    - partnership
                    - other
                message:
                  type: string
                  description: 'The message body.'
                  example: consequatur
              required:
                - name
                - email
                - topic
                - message
